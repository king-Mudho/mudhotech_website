# /etc/nginx/sites-available/mudhotech.com
#
# One public entry point on 443. Next.js serves the site; /api/django/ is NOT
# exposed — the browser never reaches Django directly. Django listens on
# 127.0.0.1:8200 only, and the Next.js Route Handlers proxy to it
# server-to-server. That is the whole point of the three-layer auth model:
# putting Django on the public internet here would bypass Layer 1.
#
# This server already hosts other sites (ABI, Digital Portal). Everything
# below is scoped to the mudhotech.com server_name, so it cannot affect them
# — but run `nginx -t` before reloading, because a syntax error in this file
# takes down every site on the box, not just this one.

# --- HTTP: redirect everything to HTTPS, except the ACME challenge --------
server {
    listen 80;
    listen [::]:80;
    server_name mudhotech.com www.mudhotech.com;

    # Certbot writes its proof here. Must stay reachable over plain HTTP or
    # renewal fails silently and the certificate expires 90 days later.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mudhotech.com$request_uri;
    }
}

# --- HTTPS: www -> apex, one canonical host ------------------------------
# Two hostnames serving identical content splits your SEO and breaks the
# canonical URLs in the sitemap. Pick one; this picks the apex.
server {
    # `listen ... http2` as a parameter, not the standalone directive: the
    # standalone spelling arrived in nginx 1.25.1 and this box runs 1.20.1,
    # where it is unknown and fails the entire config test. The parameter
    # form still works on newer nginx (deprecation warning only), so it is
    # the portable choice.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mudhotech.com;

    ssl_certificate     /etc/letsencrypt/live/mudhotech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mudhotech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mudhotech.com$request_uri;
}

# --- HTTPS: the site -----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mudhotech.com;

    ssl_certificate     /etc/letsencrypt/live/mudhotech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mudhotech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Next.js sets its own CSP, X-Frame-Options, Referrer-Policy and HSTS in
    # next.config.ts. They are deliberately NOT repeated here: duplicated
    # security headers are a common source of "why is my CSP not applying"
    # — the browser sees two and the stricter one silently wins.

    # Uploaded/static assets are small; the rest is HTML and JSON.
    client_max_body_size 4m;

    # Long-lived immutable build assets. Next fingerprints these filenames,
    # so they can be cached hard without a stale-content risk.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;

        # Without these, Next sees every request as coming from 127.0.0.1
        # over HTTP, and any absolute URL it generates comes out as
        # http://localhost:3000.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Required for Next's dev/HMR websocket and for any future streaming.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
