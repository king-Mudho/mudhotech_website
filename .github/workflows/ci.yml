name: CI

# Runs the same checks a contributor runs locally (README → Running the
# tests). Deliberately has no deploy step: production deploys stay a manual
# `deploy/deploy.sh` run on the server.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Test runs only. Production refuses to boot with DEBUG off and a weak key.
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Django 6 requires >= 3.12; matches deploy/provision.sh.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  frontend:
    name: Next.js site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://mudhotech.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The production box runs Node 20 (deploy/provision.sh).
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit runtime dependencies (critical only)
        run: npm audit --omit=dev --audit-level=critical
