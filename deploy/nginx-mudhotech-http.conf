# /etc/nginx/sites-available/mudhotech.com
#
# BOOTSTRAP config — HTTP only, no TLS. This is what gets enabled first.
#
# Why this file exists: the full config (nginx-mudhotech.conf) references
#   /etc/letsencrypt/live/mudhotech.com/fullchain.pem
# which does not exist until certbot has issued a certificate. Enabling it
# before then makes `nginx -t` fail — which blocks every reload on the box,
# and makes `certbot --nginx` fail too, because certbot validates the config
# before it does anything. That is a deadlock: nginx needs the cert, and the
# cert needs a working nginx.
#
# So: serve plain HTTP first, let certbot prove the domain over it, then
# swap in the TLS config. deploy/enable-tls.sh does that swap.
#
# On a shared box this ordering matters beyond convenience. A broken config
# in sites-enabled means nobody can reload nginx for ABI or Digital
# Respondent either, and a full restart would fail to start at all.

server {
    listen 80;
    listen [::]:80;
    server_name mudhotech.com www.mudhotech.com;

    # Certbot writes its proof here. Must resolve over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
